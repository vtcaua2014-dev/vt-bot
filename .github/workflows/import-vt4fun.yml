name: Import Vt4Fun source files
on:
  push:
    branches: [main]
    paths:
      - '.vt4fun-import.b64'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit source files
        shell: bash
        run: |
          set -euo pipefail
          test -s .vt4fun-import.b64
          base64 -d .vt4fun-import.b64 > /tmp/vt4fun-import.zip
          mkdir -p /tmp/vt4fun-source
          unzip -q /tmp/vt4fun-import.zip -d /tmp/vt4fun-source
          test -f /tmp/vt4fun-source/vt-bot/package.json
          cp -a /tmp/vt4fun-source/vt-bot/. .
          rm -f .vt4fun-import.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Vt4Fun source code"
            git push
          fi
